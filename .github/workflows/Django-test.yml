name: Django Project Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  build:

    runs-on: ubuntu-latest

    steps:
    - name: Setup Docker-Compose
      run: docker compose up -d
    - name: Run test
      run: docker exec backend sh -c "flake8 && pytest ."
